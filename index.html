<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mineclone</title>
<style>
  :root{ --mc-dark:#3d2b1f; --mc-panel:#c6c6c6; --mc-line:#000; }
  *{ margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#000; font-family:'Segoe UI',Verdana,sans-serif; }
  canvas#game{ display:block; width:100vw; height:100vh; }
  .hide{ display:none !important; }

  #hud{ position:fixed; inset:0; pointer-events:none; }
  #crosshair{ position:absolute; left:50%; top:50%; width:20px; height:20px; transform:translate(-50%,-50%); color:#fff; font-weight:bold; text-shadow:0 1px 2px #000; text-align:center; line-height:20px; font-size:18px; }
  #hotbar{ position:absolute; left:50%; bottom:8px; transform:translateX(-50%); }
  #hotbar canvas{ display:block; }
  #hearts{ position:absolute; left:12px; top:8px; }
  #hearts canvas{ display:block; }
  #selName{ position:absolute; left:50%; bottom:96px; transform:translateX(-50%); color:#fff; text-shadow:0 1px 2px #000; font-size:14px; text-align:center; }
  #msg{ position:absolute; left:50%; bottom:130px; transform:translateX(-50%); color:#fff; text-shadow:0 1px 2px #000; font-size:13px; text-align:center; opacity:0; transition:opacity .3s; }
  #debug{ position:absolute; left:12px; bottom:8px; color:#fff; text-shadow:0 1px 1px #000; font-size:11px; font-family:Consolas,monospace; white-space:pre; }
  #hurtFlash{ position:absolute; inset:0; background:radial-gradient(ellipse at center, rgba(255,0,0,0) 55%, rgba(255,0,0,.45) 100%); opacity:0; }
  #saveDot{ position:absolute; right:12px; bottom:8px; width:10px; height:10px; border-radius:50%; background:#fff; opacity:0; }

  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; pointer-events:auto; z-index:20; }
  .panel{ background:linear-gradient(#c6c6c6,#9d9d9d); border:3px solid #000; outline:3px solid rgba(0,0,0,.45); padding:18px 26px; box-shadow:0 8px 30px rgba(0,0,0,.6); image-rendering:pixelated; }
  .panel h1{ font-size:34px; color:#3d3d3d; text-shadow:2px 2px 0 #000, -1px -1px 0 #fff; letter-spacing:2px; margin-bottom:6px; font-weight:800; }
  .panel h2{ font-size:20px; color:#2f2f2f; text-shadow:1px 1px 0 #000, -1px -1px 0 #fff; margin-bottom:12px; }
  .mcbtn{ display:block; width:100%; padding:8px 16px; margin:6px 0; background-size:100% 100%; color:#fff; font-weight:bold; font-size:16px; text-shadow:1px 1px 2px #000; border:none; cursor:pointer; image-rendering:pixelated;
    background-image:linear-gradient(rgba(255,255,255,.12),rgba(0,0,0,.25)); background-color:#6e6e6e; border:2px solid #000; }
  .mcbtn:hover{ background-color:#8a8a8a; }
  .mcbtn:active{ background-color:#4d4d4d; }
  .row{ display:flex; align-items:center; gap:10px; margin:10px 0; color:#222; font-size:14px; }
  .row input[type=range]{ flex:1; }
  .row input[type=text]{ flex:1; padding:5px; font-size:14px; border:2px solid #000; }
  .kbd{ display:inline-block; background:#3a3a3a; color:#fff; border:1px solid #000; border-bottom-width:3px; border-radius:3px; padding:1px 6px; font-size:12px; font-family:Consolas,monospace; }
  #helpGrid{ display:grid; grid-template-columns:auto auto; gap:4px 14px; font-size:13px; color:#222; }
  #helpGrid .lb{ text-align:right; color:#333; }

  #invPanel{ width:min(780px,96vw); image-rendering:pixelated; }
  #invTitle{ display:flex; justify-content:space-between; color:#333; text-shadow:1px 1px 0 #000, -1px -1px 0 #fff; font-weight:bold; margin-bottom:8px; }
  #invCanvasWrap{ overflow:hidden; }
  #invCanvas{ image-rendering:pixelated; width:100%; }
  #craftHint{ color:#444; font-size:12px; margin-top:6px; }
  .close-x{ float:right; cursor:pointer; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hide">
  <div id="crosshair">+</div>
  <div id="hearts"><canvas width="182" height="20"></canvas></div>
  <div id="hotbar"><canvas width="364" height="44"></canvas></div>
  <div id="selName"></div>
  <div id="msg"></div>
  <div id="debug"></div>
  <div id="hurtFlash"></div>
  <div id="saveDot"></div>
</div>

<div id="titleScreen" class="overlay">
  <div class="panel" style="text-align:center;min-width:320px;">
    <h1>MINECLONE</h1>
    <div class="row">Сид мира:<input type="text" id="seedInput" value="1337" maxlength="16"></div>
    <button class="mcbtn" id="btnPlay">Играть</button>
    <button class="mcbtn hide" id="btnContinue">Продолжить</button>
    <div id="titleNote" style="font-size:12px;color:#333;margin-top:8px;"></div>
  </div>
</div>

<div id="settingsScreen" class="overlay hide">
  <div class="panel" style="min-width:320px;">
    <h2>Настройки</h2>
    <div id="settingsBody"></div>
    <button class="mcbtn" id="btnSettingsBack">Назад</button>
  </div>
</div>

<div id="helpScreen" class="overlay hide">
  <div class="panel" style="min-width:420px;">
    <h2>Управление</h2>
    <div id="helpGrid"></div>
    <button class="mcbtn" id="btnHelpBack">Назад</button>
  </div>
</div>

<div id="menuScreen" class="overlay hide">
  <div class="panel" style="min-width:320px;">
    <h2>Меню</h2>
    <button class="mcbtn" id="btnResume">Продолжить</button>
    <button class="mcbtn" id="btnSave">Сохранить мир</button>
    <button class="mcbtn" id="btnOpenSettings">Настройки</button>
    <button class="mcbtn" id="btnHelp">Управление</button>
    <button class="mcbtn" id="btnToTitle">В главное меню</button>
  </div>
</div>

<div id="invScreen" class="overlay hide">
  <div id="invPanel" class="panel">
    <div id="invTitle"><span>Инвентарь и крафт (E)</span><span id="mcClose" class="close-x">[X]</span></div>
    <div id="invCanvasWrap"><canvas id="invCanvas" width="1" height="1"></canvas></div>
    <div id="craftHint"></div>
    <div style="text-align:center;margin-top:8px;"><button class="mcbtn" id="btnCraftHelp" style="width:200px;font-size:13px;">Рецепты</button></div>
  </div>
</div>

<div id="craftHelpScreen" class="overlay hide">
  <div class="panel" style="min-width:360px;max-height:80vh;overflow:auto;" id="craftHelpBody"></div>
</div>

<div id="furnaceScreen" class="overlay hide">
  <div class="panel">
    <h2 style="text-align:center;">Печь</h2>
    <div style="text-align:center;"><canvas id="furnaceCanvas" width="280" height="120"></canvas></div>
    <div style="text-align:center;color:#333;font-size:13px;">Сверху: руда · Слева: топливо · Справа: результат</div>
    <div style="text-align:center;margin-top:8px;"><button class="mcbtn" id="btnFurnaceClose" style="width:200px;">Закрыть</button></div>
  </div>
</div>

<div id="deadScreen" class="overlay hide">
  <div class="panel" style="text-align:center;">
    <h1 style="color:#8a0000;">Вы погибли!</h1>
    <button class="mcbtn" id="btnRespawn">Возродиться</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/noise.js"></script>
<script src="js/blocks.js"></script>
<script src="js/world.js"></script>
<script src="js/mesher.js"></script>
<script src="js/audio.js"></script>
<script src="js/inventory.js"></script>
<script src="js/player.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
